<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sahausoptimointi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-shell">

        <header class="app-header">
            <h1>Sahausoptimointi</h1>
        </header>

        <section class="input-panel stock-panel" aria-labelledby="stockHeading">
            <h2 id="stockHeading" class="section-heading">
                <span class="section-icon" aria-hidden="true">
                    <span class="stock-bar-icon"></span>
                </span>
                <span>Raakalista</span>
            </h2>

            <div class="stock-fields">

                <label class="form-field" for="stockLength">
                    <span>Raakatangon pituus (mm)</span>
                    <input id="stockLength" type="number" value="6000" step="0.1" inputmode="decimal">
                </label>

                <label class="form-field" for="kerf">
                    <span>Sahanterän leveys (mm)</span>
                    <input id="kerf" type="number" value="3" step="0.1" inputmode="decimal">
                </label>

            </div>

            <div class="stock-profile-availability">
                <h3>Uusien tankojen saatavuus</h3>

                <div id="stockProfileList"></div>
            </div>
        </section>


        <section class="input-panel remnant-panel" aria-labelledby="remnantsHeading">
            <h2 id="remnantsHeading" class="section-heading">
                <span class="section-icon" aria-hidden="true">♻</span>
                <span>Käytettävissä olevat jäännökset</span>
            </h2>

            <p class="section-description">
                Lisää tähän varastosta löytyvät jäännöspalat.
            </p>

            <div id="remnantList"></div>

            <button class="add-cut-button" type="button" onclick="addRemnant()">
                + LISÄÄ JÄÄNNÖS
            </button>
        </section>


        <section class="input-panel cuts-panel" aria-labelledby="cutsHeading">
            <h2 id="cutsHeading" class="section-heading">
                <span class="section-icon" aria-hidden="true">✂</span>
                <span>Sahattavat kappaleet</span>
            </h2>

            <div id="cutList">

                <div class="cut-row">
                    <label class="form-field">
                        <span>Profiilityyppi</span>
                        <select class="cut-profile-type">
                            <option value="uProfile">
                                U-profiili
                            </option>

                            <option value="verticalProfile" selected>
                                Pystyprofiili
                            </option>

                            <option value="closingProfile">
                                Vasteprofiili
                            </option>

                            <option value="horizontalProfile">
                                Vaakaprofiili
                            </option>

                            <option value="topRail">
                                Yläkisko
                            </option>

                            <option value="bottomRail">
                                Alakisko
                            </option>
                        </select>
                    </label>

                    <label class="form-field">
                        <span>Väri</span>
                        <input class="cut-color" type="text" placeholder="Väri">
                    </label>

                    <label class="form-field">
                        <span>Kappaleen pituus (mm)</span>
                        <input class="cut-length" type="number" step="0.1" inputmode="decimal" placeholder="Mitta">
                    </label>

                    <label class="form-field">
                        <span>Määrä (kpl)</span>
                        <input class="cut-quantity" type="number" value="1" step="1" inputmode="numeric"
                            placeholder="Kpl">
                    </label>

                    <button class="remove-cut-button" type="button" onclick="removeCut(this)">
                        POISTA
                    </button>
                </div>

            </div>

            <button class="add-cut-button" type="button" onclick="addCut()">
                + LISÄÄ MITTA
            </button>
        </section>


        <button id="calculateButton" class="calculate-button" type="button" onclick="calculate()">
            LASKE
        </button>

        <div id="result" aria-live="polite"></div>


        <section class="new-work-section" aria-labelledby="newWorkHeading">
            <h2 id="newWorkHeading">Aloita alusta</h2>

            <p>
                Poistaa tallennetun työn ja palauttaa oletussyötteet.
            </p>

            <button class="new-work-button" type="button" onclick="startNewWork()">
                UUSI TYÖ
            </button>
        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
